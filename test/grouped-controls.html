<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grouped Controls — Validation Fixtures (#135)</title>
    <link rel="stylesheet" href="/dist/chota.css" />
    <style>
      .narrow-container {
        max-width: 400px;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Fixture 1: Normal grouped controls (desktop) -->
      <div class="grouped" id="fixture1">
        <input type="search" placeholder="Search query" />
        <button class="button primary">Search</button>
        <button class="button">Lucky</button>
      </div>

      <!-- Fixture 2: Wrapping grouped controls (narrow) -->
      <div class="narrow-container">
        <div class="grouped" id="fixture2">
          <button class="button">A</button>
          <button class="button">B</button>
          <button class="button">C</button>
          <button class="button">D</button>
          <button class="button">E</button>
          <button class="button">F</button>
          <button class="button">G</button>
          <button class="button">H</button>
        </div>
      </div>

      <!-- Fixture 3: Gapless controls when wrapping (narrow) -->
      <div class="narrow-container">
        <div class="grouped gapless" id="fixture3">
          <input type="text" placeholder="Username" />
          <input type="text" placeholder="Domain" />
          <button class="button primary">Submit</button>
        </div>
      </div>

      <!-- Fixture 4: Mixed input/select/button heights (narrow) -->
      <div class="narrow-container">
        <div class="grouped" id="fixture4">
          <select>
            <option>Category</option>
            <option>Option One</option>
            <option>Option Two</option>
          </select>
          <input type="text" placeholder="Filter text" />
          <button class="button primary">Go</button>
        </div>
      </div>
    </div>
  </body>
</html>
