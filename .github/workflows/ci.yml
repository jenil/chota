name: CI

on:
  pull_request:
    branches:
      - v1

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
            ${{ runner.os }}-yarn-

      - name: Cache browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint CSS (stylelint)
        run: yarn test

      - name: Build (PostCSS + size gate)
        run: yarn build

      - name: CSS Public API Contract
        run: yarn test:api

      - name: Install Chromium for VRT
        run: npx playwright install --with-deps chromium

      - name: Visual Regression Tests (Chromium)
        run: yarn test:vrt

      - name: Upload VRT artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-screenshots
          path: test/vrt/results/
          retention-days: 30

      - name: Install Firefox and WebKit for smoke coverage
        run: npx playwright install --with-deps firefox webkit

      - name: Accessibility (axe-core)
        run: yarn test:a11y

      - name: Upload a11y artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-findings
          path: test/vrt/results/
          retention-days: 30

      - name: Browser smoke coverage (Firefox + WebKit)
        run: npx playwright test test/vrt/browser-smoke.spec.js --project=firefox --project=webkit --workers 1

      - name: Upload smoke coverage artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-coverage
          path: test/vrt/results/
          retention-days: 30
